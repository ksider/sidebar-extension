<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Extension Switcher</title>
    <script type="module" crossorigin src="../../assets/sidebar-CykELT2P.js"></script>
    <link rel="stylesheet" crossorigin href="../../assets/sidebar-iEgMa3iE.css">
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.3"/><rect x="13" y="3" width="8" height="8" rx="1.3"/><rect x="3" y="13" width="8" height="8" rx="1.3"/><path d="M17 13v8m-4-4h8"/></svg>
          </span>
          <h1 id="app-title">Extension Switcher</h1>
          <span class="local-hint">Локально</span>
        </div>
        <label class="search" for="search">
          <span class="visually-hidden">Поиск расширений</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Поиск расширений" />
          <button id="clear-search" class="clear-search" type="button" aria-label="Очистить поиск" hidden>×</button>
        </label>
        <nav class="tabs" aria-label="Фильтр расширений" role="tablist">
          <button class="tab" id="tab-favorites" type="button" data-tab="favorites" aria-selected="true" aria-controls="list" role="tab">Избранное <span class="count" id="favorites-count">0</span></button>
          <button class="tab" id="tab-all" type="button" data-tab="all" aria-selected="false" aria-controls="list" role="tab">Все <span class="count" id="all-count">0</span></button>
        </nav>
      </header>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <section id="list" class="extension-list" aria-live="polite" aria-label="Расширения" role="tabpanel" aria-labelledby="tab-favorites"></section>
      <footer class="footer"><span id="extension-status">0 активных из 0</span><span class="local-mode">Локальный режим</span></footer>
    </main>
  </body>
</html>
